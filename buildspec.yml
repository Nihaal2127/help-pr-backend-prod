version: 0.2

env:
  variables:
    LAMBDA_FUNCTION_NAME: "help-pr-backend-prod"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Writing Firebase credentials from Secrets Manager..."
      - mkdir -p resources
      - aws secretsmanager get-secret-value --secret-id help-pr/firebase/adminsdk-customer --query SecretString --output text --region "$AWS_DEFAULT_REGION" > resources/adminsdk-customer.json
      - aws secretsmanager get-secret-value --secret-id help-pr/firebase/adminsdk-partner --query SecretString --output text --region "$AWS_DEFAULT_REGION" > resources/adminsdk-partner.json
      - test -s resources/adminsdk-customer.json
      - test -s resources/adminsdk-partner.json
      - python -c "import json; json.load(open('resources/adminsdk-customer.json')); json.load(open('resources/adminsdk-partner.json'))"
      - echo "Firebase JSON files written and parsed Okay"

  build:
    commands:
      - echo "Packaging Lambda artifact..."
      - zip -r deploy.zip . -x ".git/*" ".github/*" ".env*" "coverage/*" "uploads/*" "temp/*" "tmp/*"

  post_build:
    commands:
      - echo "Deploying to Lambda ${LAMBDA_FUNCTION_NAME} (${AWS_DEFAULT_REGION})"
      - aws lambda update-function-code --function-name "${LAMBDA_FUNCTION_NAME}" --zip-file "fileb://deploy.zip" --region "${AWS_DEFAULT_REGION}"
      - echo "Deployment command completed."
      - echo "Reminder - set Lambda env vars separately - CHAT_SERVICE_ENABLED, CHAT_SERVICE_BASE_URL, CHAT_SERVICE_INTERNAL_API_KEY (see docs/LAMBDA_VPS_DEPLOY.md)"

artifacts:
  files:
    - deploy.zip
